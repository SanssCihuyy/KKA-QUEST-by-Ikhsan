<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KKA Quest: Misi Koding dan Kecerdasan Artifisial</title>
<style>
:root{--ink:#12263f;--ink2:#1d3a5f;--paper:#f5f7fa;--amb:#ffb400;--grn:#14724a;--red:#b3261e;--mut:#4a5d75}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a1626;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#st{width:min(100vw,177.78vh);aspect-ratio:16/9;background:var(--ink);color:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden}
#hd{display:flex;align-items:center;gap:.6em;padding:.5em .9em;background:#0c1b2e;min-height:2.6em;border-bottom:.12em solid var(--amb)}
#hd b{flex:1;font-size:1em}
#mn{flex:1;padding:.9em 1.2em;display:flex;flex-direction:column;gap:.7em;min-height:0;overflow:hidden}
#ft{display:flex;justify-content:space-between;padding:.5em .9em;background:#0c1b2e}
button{font:inherit;cursor:pointer;border:.12em solid var(--amb);background:var(--amb);color:#1a1200;border-radius:.4em;padding:.45em 1em;min-height:2.4em;font-weight:700}
button.g{background:transparent;color:var(--paper);border-color:#7f93ab}
button:hover:not(:disabled){filter:brightness(1.1)}button:focus-visible{outline:.15em solid #fff;outline-offset:.1em}
button:disabled{opacity:.55;cursor:default}
.card{background:var(--paper);color:var(--ink);border-radius:.6em;padding:.9em 1.1em}
h1{font-size:2.3em;line-height:1.1}h2{font-size:1.5em}p{line-height:1.4}
.row{display:flex;gap:.8em}.col{display:flex;flex-direction:column;gap:.6em}.f1{flex:1;min-width:0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.opts button{background:#fff;color:var(--ink);border-color:#9fb2c8;text-align:left;font-weight:600;min-height:3em}
button.ok{background:#d6f3e4!important;border-color:var(--grn)!important;color:#08381f!important}
button.no{background:#fbdcd9!important;border-color:var(--red)!important;color:#5c0f0a!important}
pre{background:#0c1b2e;color:#bff0d4;padding:.6em .9em;border-radius:.4em;font:1em/1.35 Consolas,monospace;white-space:pre-wrap}
#fb{min-height:3.2em;padding:.5em .8em;border-radius:.4em;font-weight:600;line-height:1.35}
#fb.ok{background:#d6f3e4;color:#08381f;border-left:.35em solid var(--grn)}
#fb.no{background:#fbdcd9;color:#5c0f0a;border-left:.35em solid var(--red)}
#fb.in{background:#e3ecf7;color:var(--ink);border-left:.35em solid #3a6ea5}
.bar{height:.6em;background:#2a4565;border-radius:1em;overflow:hidden}.bar i{display:block;height:100%;background:var(--amb);width:0;transition:width .3s}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:.7em;flex:1}
.lv{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.3em;padding:.5em;min-height:0}
.lv:disabled{background:#51667f;color:#e8eef5;border-color:#51667f;opacity:1}
.step{background:#fff;color:var(--ink);border-color:#9fb2c8;text-align:left;font-weight:600}
.flow{display:flex;flex-direction:column;gap:.3em}.flow div{background:#d6f3e4;color:#08381f;border-radius:.3em;padding:.3em .6em;font-weight:600}
.tag{background:var(--amb);color:#1a1200;border-radius:.3em;padding:.1em .5em;font-weight:700}
table{width:100%;border-collapse:collapse}td{padding:.3em .5em;border-bottom:1px solid #c5d1e0}
</style></head><body>
<div id="st"><div id="hd"></div><div id="mn"></div><div id="ft"></div></div>
<script>
const $=s=>document.querySelector(s),H=$('#hd'),M=$('#mn'),F=$('#ft'),ST=$('#st');
function fit(){ST.style.fontSize=(ST.clientWidth/62)+'px'}addEventListener('resize',fit);fit();
const SH=(a,o)=>o.map(i=>a[i]);
const L=[
{n:'Kenali AI',ic:'🔍',g:'Membedakan sistem yang memakai AI dan yang bukan.',job:'Teknisi TI perlu tahu kapan solusi AI dibutuhkan.',t:'mc',q:[
{p:'Kamera ponsel mengenali wajah otomatis untuk mengatur fokus.',o:['Memakai AI','Bukan AI'],a:0,w:'Kamera belajar mengenali pola wajah dari banyak data foto.'},
{p:'Kalkulator menghitung 25 + 17.',o:['Memakai AI','Bukan AI'],a:1,w:'Kalkulator mengikuti aturan hitung tetap dan tidak belajar dari data.'},
{p:'Aplikasi ojek online memprediksi waktu tiba dari data lalu lintas.',o:['Memakai AI','Bukan AI'],a:0,w:'Prediksi dibuat dari pola data perjalanan sebelumnya.'},
{p:'Lampu menyala saat saklar ditekan.',o:['Memakai AI','Bukan AI'],a:1,w:'Ini rangkaian listrik biasa tanpa proses belajar.'},
{p:'Chatbot layanan pelanggan menjawab pertanyaan dengan bahasa sehari-hari.',o:['Memakai AI','Bukan AI'],a:0,w:'Chatbot dilatih dari banyak contoh percakapan.'},
{p:'Timer oven berbunyi setelah 30 menit.',o:['Memakai AI','Bukan AI'],a:1,w:'Timer hanya menghitung waktu sesuai pengaturan.'}]},
{n:'Susun Algoritma',ic:'🧩',g:'Mengurutkan langkah algoritma secara logis.',job:'Programmer kasir dan gudang menyusun alur kerja sistem.',t:'sort',title:'Algoritma kasir minimarket: urutkan langkahnya!',steps:['Pindai barcode barang','Cari harga barang di basis data','Tambahkan harga ke total belanja','Terima pembayaran pelanggan','Hitung uang kembalian','Cetak struk belanja'],mix:[3,0,5,1,4,2],why:['Alur dimulai dari input, yaitu barcode.','Harga dicari berdasarkan barcode tadi.','Total belanja dihitung dari harga barang.','Pembayaran diterima setelah total diketahui.','Kembalian dihitung dari uang bayar dikurangi total.','Struk dicetak terakhir sebagai output.']},
{n:'Logika dan Kode',ic:'💻',g:'Membaca kode: percabangan, perulangan, variabel.',job:'Teknisi otomasi menulis kode sensor dan mesin.',t:'mc',q:[
{p:'Apa nilai kipas setelah kode ini berjalan?',c:'suhu = 90\nif suhu > 80:\n    kipas = "MENYALA"\nelse:\n    kipas = "MATI"',o:['MENYALA','MATI','Error'],a:0,w:'Suhu 90 lebih besar dari 80, jadi cabang if dijalankan.'},
{p:'Berapa kali kata "Halo" tercetak?',c:'for i in range(3):\n    print("Halo")',o:['1 kali','3 kali','4 kali'],a:1,w:'range(3) menghasilkan 0, 1, 2, yaitu 3 putaran.'},
{p:'Apa yang tercetak oleh kode ini?',c:'stok = 10\nstok = stok - 3\nprint(stok)',o:['3','10','7'],a:2,w:'Variabel stok diperbarui menjadi 10 - 3 = 7.'},
{p:'Apa yang tercetak oleh kode ini?',c:'nilai = 75\nif nilai >= 70:\n    print("Lulus")\nelse:\n    print("Remedial")',o:['Lulus','Remedial','75'],a:0,w:'75 memenuhi syarat nilai >= 70.'}]},
{n:'Latih Model AI',ic:'🧠',g:'Memahami istilah dasar pembelajaran mesin.',job:'Teknisi data menyiapkan dataset untuk AI sortir hasil panen.',t:'match',title:'Pasangkan istilah dengan artinya. Pilih istilah, lalu pilih artinya.',terms:['Dataset','Model','Pelatihan','Prediksi','Bias'],defs:['Kumpulan data contoh untuk belajar AI','Hasil belajar AI yang dipakai membuat prediksi','Proses AI mengenali pola dari data','Jawaban model untuk data baru','Hasil tidak adil karena data latih tidak seimbang'],mix:[2,4,0,3,1]},
{n:'Keputusan Etis',ic:'⚖️',g:'Mengambil keputusan etis dengan waktu terbatas.',job:'Setiap profesi digital wajib menjaga etika dan data pribadi.',t:'mc',time:15,q:[
{p:'AI seleksi pelamar kerjamu dilatih dari data yang hampir semuanya berasal dari satu kelompok. Tindakanmu?',o:['Langsung dipakai agar cepat','Tambah data yang beragam, lalu uji lagi','Abaikan, nanti juga membaik'],a:1,w:'Data tidak seimbang menimbulkan bias. Data beragam membuat hasil lebih adil.'},
{p:'Chatbot menjawab dengan yakin, tetapi kamu ragu jawabannya benar. Tindakanmu?',o:['Salin langsung ke laporan','Periksa ke sumber tepercaya','Tanya chatbot yang sama lagi'],a:1,w:'AI bisa keliru. Selalu verifikasi informasi penting.'},
{p:'Klien meminta foto pelanggan untuk melatih AI. Tindakanmu?',o:['Berikan semua foto','Minta izin dan samarkan identitas, sesuai UU PDP','Jual datanya ke pihak lain'],a:1,w:'Data pribadi harus dilindungi: ada izin dan identitas disamarkan.'},
{p:'AI menyarankan keputusan penting di bengkel yang menyangkut keselamatan. Tindakanmu?',o:['Ikuti saja AI','Jadikan AI pembantu, manusia memutuskan','Matikan semua alat'],a:1,w:'AI membantu analisis, tetapi tanggung jawab akhir ada pada manusia.'}]}
];
const S={un:1,best:[0,0,0,0,0],stars:[0,0,0,0,0],cur:0,lives:3,sc:0,qi:0,lock:false,ord:[],sel:null,done:[],tm:null,snd:true};
let AC;function beep(ok){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=ok?660:220;o.type=ok?'sine':'square';g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(ok?.15:.25))}catch(e){}}
function head(extra){H.innerHTML='<b>KKA Quest</b>'+(extra||'')+'<button class="g" onclick="guide()">Panduan</button><button class="g" onclick="mapv()">Peta Misi</button><button class="g" onclick="S.snd=!S.snd;this.textContent=S.snd?\'🔊 Suara\':\'🔇 Senyap\'">'+(S.snd?'🔊 Suara':'🔇 Senyap')+'</button>'}
function nav(b,n,nl){F.innerHTML='<button class="g" '+(b?'onclick="'+b+'"':'disabled')+'>◀ Kembali</button><button '+(n?'onclick="'+n+'"':'disabled')+'>'+(nl||'Berikutnya')+' ▶</button>'}
function stopT(){clearInterval(S.tm)}
function home(){stopT();H.style.display='none';M.innerHTML='<div class="row" style="flex:1;align-items:center"><div class="col f1"><span class="tag" style="align-self:flex-start">Gim Edukasi · 5 Level</span><h1>KKA Quest: Misi Koding dan Kecerdasan Artifisial</h1><p style="font-size:1.15em">Bisakah mesin belajar sendiri? Selesaikan 5 misi dan buktikan sendiri!</p><p>Halo, teman-teman! Di gim ini kamu menjadi teknisi digital magang. Kenali AI, susun algoritma, baca kode, latih model, dan ambil keputusan etis. Kumpulkan bintang dan skor tertinggimu, ya!</p></div><div class="card" style="width:38%;text-align:center;font-size:1.1em"><div style="font-size:3.2em;line-height:1.3">🤖⚙️💻</div><p><b>Misi yang menantimu</b></p><p>🔍 Kenali AI → 🧩 Algoritma → 💻 Kode → 🧠 Model → ⚖️ Etika</p></div></div>';nav(null,'guide()','Mulai');F.firstChild.style.visibility='hidden'}
function guide(){stopT();H.style.display='';head();M.innerHTML='<h2>Panduan Bermain</h2><div class="row f1"><div class="card f1"><p><b>Tujuan belajar</b></p><p>Setelah bermain, kamu mampu: (1) membedakan sistem AI dan non-AI, (2) menyusun algoritma, (3) membaca kode sederhana, (4) menjelaskan istilah pembelajaran mesin, (5) memilih tindakan etis saat memakai AI.</p></div><div class="card f1"><p><b>Aturan</b></p><p>❤ Tiap level punya 3 nyawa. Jawaban salah mengurangi 1 nyawa.<br>⭐ Bintang = sisa nyawa saat level selesai.<br>🏆 Setiap jawaban benar +100 skor. Level 5 memakai batas waktu 15 detik per soal.<br>🔓 Selesaikan level untuk membuka level berikutnya. Level yang sudah terbuka boleh diulang kapan saja lewat Peta Misi.</p></div></div>';nav('home()','mapv()','Peta Misi')}
function mapv(){stopT();H.style.display='';head();let t=S.stars.reduce((a,b)=>a+b,0);M.innerHTML='<div class="row" style="align-items:center"><h2 class="f1">Peta Misi</h2><span>⭐ '+t+' / 15 · Skor terbaik: '+S.best.reduce((a,b)=>a+b,0)+'</span></div><div class="map">'+L.map((l,i)=>'<button class="lv" '+(i<S.un?'onclick="start('+i+')"':'disabled')+'><span style="font-size:2.4em">'+(i<S.un?l.ic:'🔒')+'</span><b>Level '+(i+1)+'</b><span>'+l.n+'</span><span>'+'⭐'.repeat(S.stars[i])+'☆'.repeat(3-S.stars[i])+'</span></button>').join('')+'</div><div class="card">Selesaikan semua level untuk melihat hasil akhirmu.'+(S.un>4&&S.stars[4]?' <button onclick="final()">Lihat hasil akhir</button>':'')+'</div>';nav('guide()',S.un>0?'start('+Math.min(S.un-1,4)+')':null,'Main')}
function lh(){const l=L[S.cur];head('<span>Level '+(S.cur+1)+' dari 5: '+l.n+'</span><span style="font-size:1.1em">'+'❤'.repeat(S.lives)+'🖤'.repeat(3-S.lives)+'</span><span class="tag">Skor '+S.sc+'</span>')}
function start(i){stopT();S.cur=i;S.lives=3;S.sc=0;S.qi=0;S.ord=[];S.sel=null;S.done=[];S.lock=false;H.style.display='';const t=L[i].t;t=='mc'?mcq():t=='sort'?sortv():matchv()}
function pbar(n,tot,txt){return '<div class="row" style="align-items:center"><span>'+txt+'</span><div class="bar f1"><i style="width:'+(n/tot*100)+'%"></i></div></div>'}
function mcq(){const l=L[S.cur],q=l.q[S.qi];S.lock=false;lh();M.innerHTML=pbar(S.qi,l.q.length,'Soal '+(S.qi+1)+' dari '+l.q.length)+(l.time?'<div class="row" style="align-items:center"><span id="tl">⏱ '+l.time+' dtk</span><div class="bar f1"><i id="tb" style="width:100%;background:#ff7a59"></i></div></div>':'')+'<div class="card col" style="flex:1;justify-content:center"><h2 style="font-size:1.25em">'+q.p+'</h2>'+(q.c?'<pre>'+q.c+'</pre>':'')+'<div class="opts" style="'+(q.o.length==2?'':'')+'">'+q.o.map((o,i)=>'<button onclick="ans('+i+')">'+o+'</button>').join('')+'</div></div><div id="fb" class="in">Pilih jawabanmu. Hasilnya langsung ditampilkan di sini.</div>';nav('mapv()',null);if(l.time){let t=l.time;S.tm=setInterval(()=>{t-=.1;$('#tb').style.width=Math.max(0,t/l.time*100)+'%';$('#tl').textContent='⏱ '+Math.ceil(Math.max(t,0))+' dtk';S.left=t;if(t<=0){stopT();ans(-1)}},100)}}
function ans(i){if(S.lock)return;S.lock=true;stopT();const l=L[S.cur],q=l.q[S.qi],ok=i==q.a,b=M.querySelectorAll('.opts button');b.forEach((x,k)=>{x.disabled=true;if(k==q.a)x.classList.add('ok')});let bonus=0;if(ok){bonus=l.time?Math.round(S.left*5):0;S.sc+=100+bonus}else{if(i>=0)b[i].classList.add('no');S.lives--}beep(ok);const f=$('#fb');f.className=ok?'ok':'no';f.textContent=(ok?'Benar! +'+(100+bonus)+' skor. ':(i<0?'Waktu habis! ':'Belum tepat. '))+q.w;lh();const last=S.qi>=l.q.length-1;nav('mapv()','nx()',S.lives<=0?'Lanjut':last?'Selesai':'Soal berikutnya')}
function nx(){if(S.lives<=0)return over();S.qi++;if(S.qi>=L[S.cur].q.length)return fin();mcq()}
function sortv(){const l=L[S.cur];lh();M.innerHTML=pbar(S.ord.length,6,'Langkah '+Math.min(S.ord.length+1,6)+' dari 6')+'<p><b>'+l.title+'</b></p><div class="row f1" style="min-height:0"><div class="card col f1" style="justify-content:center">'+SH(l.steps.map((s,i)=>[s,i]),l.mix).map(([s,i])=>'<button class="step '+(S.ord.includes(i)?'ok':'')+'" '+(S.ord.includes(i)?'disabled':'onclick="pick('+i+')"')+'>'+s+'</button>').join('')+'</div><div class="card f1"><b>Alur algoritma kamu</b><div class="flow" style="margin-top:.4em">'+S.ord.map((i,k)=>'<div>'+(k+1)+'. '+l.steps[i]+'</div>').join('')+'</div></div></div><div id="fb" class="in">Pilih langkah yang harus dilakukan lebih dulu.</div>';nav('mapv()',null)}
function pick(i){const l=L[S.cur];if(i==S.ord.length){S.ord.push(i);S.sc+=100;beep(1);sortv();const f=$('#fb');f.className='ok';f.textContent='Tepat! '+l.why[i];if(S.ord.length==6)nav('mapv()','fin()','Selesai')}else{S.lives--;beep(0);lh();const f=$('#fb');f.className='no';f.textContent='Belum tepat. Langkah "'+l.steps[i]+'" belum waktunya. Coba pikirkan alur dari input ke output.';if(S.lives<=0)nav('mapv()','over()','Lanjut')}}
function matchv(){const l=L[S.cur];lh();M.innerHTML=pbar(S.done.length,5,'Pasangan '+S.done.length+' dari 5')+'<p><b>'+l.title+'</b></p><div class="row f1" style="min-height:0"><div class="card col f1" style="justify-content:space-around">'+l.terms.map((t,i)=>'<button class="step '+(S.done.includes(i)?'ok':S.sel==i?'':'')+'" id="t'+i+'" style="'+(S.sel==i?'border-color:var(--amb);background:#fff3cc':'')+'" '+(S.done.includes(i)?'disabled':'onclick="selT('+i+')"')+'>'+t+'</button>').join('')+'</div><div class="card col f1" style="justify-content:space-around">'+l.mix.map(i=>'<button class="step '+(S.done.includes(i)?'ok':'')+'" id="d'+i+'" '+(S.done.includes(i)?'disabled':'onclick="selD('+i+')"')+'>'+l.defs[i]+'</button>').join('')+'</div></div><div id="fb" class="in">Pilih satu istilah di kiri, lalu pilih artinya di kanan.</div>';nav('mapv()',S.done.length==5?'fin()':null,'Selesai')}
function selT(i){S.sel=i;const m=$('#fb').textContent;matchv();$('#fb').textContent='Istilah "'+L[S.cur].terms[i]+'" dipilih. Sekarang pilih artinya.'}
function selD(i){if(S.sel==null){$('#fb').textContent='Pilih istilah di kiri dulu.';return}const l=L[S.cur];if(S.sel==i){S.done.push(i);S.sc+=100;S.sel=null;beep(1);matchv();const f=$('#fb');f.className='ok';f.textContent='Cocok! '+l.terms[i]+' = '+l.defs[i]+'.';if(S.done.length==5)nav('mapv()','fin()','Selesai')}else{S.lives--;beep(0);const e=$('#d'+i);e.classList.add('no');lh();const f=$('#fb');f.className='no';f.textContent='Belum cocok. Arti itu bukan untuk "'+l.terms[S.sel]+'". Baca lagi artinya dengan teliti.';if(S.lives<=0)nav('mapv()','over()','Lanjut')}}
function fin(){stopT();const i=S.cur,l=L[i],st=Math.max(1,S.lives);S.best[i]=Math.max(S.best[i],S.sc);S.stars[i]=Math.max(S.stars[i],st);if(i<4)S.un=Math.max(S.un,i+2);else S.un=5;H.style.display='';head();M.innerHTML='<div class="card col" style="flex:1;justify-content:center;text-align:center;align-items:center"><div style="font-size:3em">'+'⭐'.repeat(st)+'☆'.repeat(3-st)+'</div><h2>Level '+(i+1)+' selesai!</h2><p>Skor level ini: <b>'+S.sc+'</b> · Sisa nyawa: '+S.lives+'</p><p><b>Kompetensi:</b> '+l.g+'</p><p><b>Di dunia kerja:</b> '+l.job+'</p></div><div class="row" style="justify-content:center"><button class="g" onclick="start('+i+')">Ulangi level</button></div>';nav('mapv()',i<4?'start('+(i+1)+')':'final()',i<4?'Level '+(i+2):'Hasil akhir')}
function over(){stopT();H.style.display='';head();M.innerHTML='<div class="card col" style="flex:1;justify-content:center;text-align:center;align-items:center"><div style="font-size:3em">💔</div><h2>Nyawa habis</h2><p>Tidak apa-apa, gagal itu bagian dari belajar. Ingat lagi penjelasan di umpan balik, lalu coba lagi. Skor level ini: '+S.sc+'.</p></div>';nav('mapv()','start('+S.cur+')','Coba lagi')}
function final(){stopT();H.style.display='';head();const t=S.best.reduce((a,b)=>a+b,0),s=S.stars.reduce((a,b)=>a+b,0),r=s>=13?'Teknisi Digital Ahli':s>=9?'Teknisi Digital Mahir':'Teknisi Digital Magang';M.innerHTML='<div class="row f1"><div class="card col f1" style="justify-content:center;text-align:center"><div style="font-size:3em">🏆</div><h2>'+r+'</h2><p style="font-size:1.3em">Total skor <b>'+t+'</b> · ⭐ '+s+' / 15</p><p>'+(s>=13?'Luar biasa! Kamu menguasai dasar KKA.':s>=9?'Bagus! Ulangi level berbintang sedikit untuk mencapai nilai penuh.':'Awal yang baik. Ulangi level yang bintangnya masih sedikit.')+'</p></div><div class="card f1"><b>Rincian level</b><table>'+L.map((l,i)=>'<tr><td>'+l.ic+' '+l.n+'</td><td>'+'⭐'.repeat(S.stars[i])+'</td><td>'+S.best[i]+'</td></tr>').join('')+'</table><p style="margin-top:.5em">Level dengan bintang kurang artinya kamu masih perlu mengulang konsepnya.</p></div></div>';nav('mapv()','credit()','Informasi Kreator')}
